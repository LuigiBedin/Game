<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Maria - Il giorno della Sagra</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}
html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0f141c;
    font-family: 'Arial Black', Impact, sans-serif;
    color: white;
    touch-action: manipulation;
}

/* SFONDO COPERTINA */
#cover-background {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at center, #2e4359 0%, #151d28 65%, #0a0d13 100%);
    z-index: 1;
}

/* Elementi collage sullo sfondo */
.collage-item {
    position: absolute;
    pointer-events: none;
    opacity: 0.88;
    filter: drop-shadow(0 8px 20px rgba(0,0,0,0.65));
    transition: all 0.3s ease;
}

/* Posizionamenti specifici responsive */
.item-badante {
    top: 6%;
    left: 50%;
    transform: translateX(-50%);
    width: clamp(170px, 32vw, 290px);
    z-index: 2;
    opacity: 0.95;
    filter: drop-shadow(0 0 35px rgba(255,50,50,0.55));
}
.item-cane {
    bottom: 6%;
    left: 4%;
    width: clamp(120px, 22vw, 220px);
    z-index: 3;
}
.item-taxi {
    top: 18%;
    left: 2%;
    width: clamp(160px, 28vw, 310px);
    transform: rotate(-8deg);
    z-index: 2;
    opacity: 0.85;
}
.item-infermiere {
    top: 18%;
    right: 2%;
    width: clamp(140px, 24vw, 250px);
    transform: rotate(10deg);
    z-index: 2;
    opacity: 0.85;
}
.item-ostacolo {
    bottom: 10%;
    right: 22%;
    width: clamp(90px, 15vw, 140px);
    z-index: 2;
    opacity: 0.8;
}
.item-punto1 {
    bottom: 30%;
    left: 18%;
    width: clamp(65px, 12vw, 110px);
    z-index: 2;
    opacity: 0.85;
}
.item-punto2 {
    top: 12%;
    left: 32%;
    width: clamp(55px, 10vw, 85px);
    z-index: 2;
    opacity: 0.65;
}

/* STRATO DI VETRO DA ROMPERE */
#glass-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 5;
    background: rgba(255, 255, 255, 0.04);
    box-shadow: inset 0 0 80px rgba(255,255,255,0.22);
    cursor: pointer;
}

#crack-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 6;
}

/* CONTENITORE CENTRALE */
#hero-box {
    position: absolute;
    top: 48%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    max-width: 900px;
    width: 92%;
    z-index: 4;
    pointer-events: none;
    padding: 10px;
}

.badge-sagra {
    display: inline-block;
    background: linear-gradient(135deg, #ff3b30, #ff9500);
    color: #fff;
    font-size: clamp(12px, 2.5vw, 18px);
    letter-spacing: 2px;
    padding: 6px 18px;
    border-radius: 50px;
    box-shadow: 0 4px 15px rgba(255, 59, 48, 0.45);
    margin-bottom: 12px;
    text-transform: uppercase;
}

h1.hero-title {
    font-size: clamp(20px, 5vw, 48px);
    line-height: 1.15;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 4px 20px rgba(0,0,0,0.9), 0 0 30px rgba(255, 204, 0, 0.45);
    margin-bottom: 12px;
}

p.hero-sub {
    font-family: Arial, sans-serif;
    font-weight: 700;
    font-size: clamp(14px, 2.8vw, 20px);
    color: #fce881;
    line-height: 1.4;
    text-shadow: 0 2px 10px rgba(0,0,0,0.95);
    margin-bottom: 22px;
}

/* PULSANTE / PROMPT ADATTIVO */
.prompt-box {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(0, 0, 0, 0.78);
    border: 2px solid #ffcc00;
    color: #fff;
    padding: 12px 24px;
    border-radius: 40px;
    font-size: clamp(13px, 2.5vw, 18px);
    box-shadow: 0 0 20px rgba(255, 204, 0, 0.4);
    animation: pulsePrompt 1.3s infinite alternate ease-in-out;
    pointer-events: auto;
    cursor: pointer;
    min-height: 48px;
}

.key-cap {
    background: #ffcc00;
    color: #000;
    padding: 4px 12px;
    border-radius: 6px;
    font-weight: 900;
    letter-spacing: 1px;
}

@keyframes pulsePrompt {
    from { transform: scale(0.97); box-shadow: 0 0 12px rgba(255,204,0,0.3); }
    to { transform: scale(1.03); box-shadow: 0 0 30px rgba(255,204,0,0.8); }
}

/* ACCETTA IN MANO */
#axe-container {
    position: absolute;
    right: 4%;
    bottom: -2%;
    width: clamp(180px, 32vw, 420px);
    height: clamp(180px, 32vw, 420px);
    z-index: 10;
    pointer-events: none;
    transform-origin: 75% 90%;
}

#axe-img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(-10px -8px 20px rgba(0,0,0,0.65));
}

/* ANIMAZIONE FENDENTE VETRO */
.swing-axe {
    animation: smashGlass 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.2) forwards;
}

@keyframes smashGlass {
    0% {
        transform: rotate(0deg) translate(0, 0);
    }
    30% {
        transform: rotate(25deg) translate(15px, -30px);
    }
    60% {
        transform: rotate(-55deg) translate(-120px, -90px) scale(1.12);
    }
    100% {
        transform: rotate(-35deg) translate(-90px, -65px);
    }
}

.broken-flash {
    animation: whiteFlash 0.35s ease-out forwards;
}

@keyframes whiteFlash {
    0% { background: rgba(255, 255, 255, 0.95); }
    100% { background: transparent; }
}

/* SELETTORE DIFFICOLTÀ (TOUCH-FRIENDLY & SAFE-AREA COMPLIANT) */
#diff-selector {
    position: absolute;
    top: max(12px, env(safe-area-inset-top));
    left: max(12px, env(safe-area-inset-left));
    z-index: 8;
    background: rgba(0,0,0,0.75);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 12px;
    padding: 6px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: Arial, sans-serif;
    font-size: clamp(12px, 2.5vw, 15px);
}
#diff-selector select {
    background: #1e1e1e;
    color: #fff;
    border: 1px solid #ffcc00;
    border-radius: 8px;
    padding: 6px 10px;
    font-weight: bold;
    font-size: clamp(12px, 2.5vw, 15px);
    outline: none;
    cursor: pointer;
    min-height: 38px;
}

/* OTTIMIZZAZIONI SPECIFICHE PER SCHERMI VERTICALI / SMARTPHONE */
@media (max-width: 600px), (max-height: 600px) {
    #hero-box {
        top: 45%;
        width: 96%;
    }
    .badge-sagra {
        margin-bottom: 8px;
        padding: 4px 14px;
    }
    h1.hero-title {
        margin-bottom: 8px;
    }
    p.hero-sub {
        margin-bottom: 16px;
    }
    .item-badante {
        top: 4%;
        width: clamp(140px, 38vw, 210px);
        opacity: 0.9;
    }
    .item-taxi {
        top: 15%;
        left: -8px;
        width: 140px;
        opacity: 0.55;
    }
    .item-infermiere {
        top: 15%;
        right: -8px;
        width: 125px;
        opacity: 0.55;
    }
    .item-cane {
        bottom: 4%;
        left: 2%;
        width: 110px;
        opacity: 0.75;
    }
    .item-ostacolo {
        bottom: 8%;
        right: 18%;
        width: 80px;
        opacity: 0.6;
    }
    #axe-container {
        right: 1%;
        bottom: -2%;
        width: 190px;
        height: 190px;
    }
}
</style>
</head>
<body>

<div id="diff-selector">
    <label for="diff-select">Difficoltà:</label>
    <select id="diff-select">
        <option value="facile">Facile</option>
        <option value="normale" selected>Normale</option>
        <option value="difficile">Difficile</option>
    </select>
</div>

<div id="cover-background">
    <!-- Badante sullo sfondo -->
    <img src="Nemico Front.svg" class="collage-item item-badante" alt="Badante">
    
    <!-- Cane fedele di supporto -->
    <img src="Cane 2.svg" class="collage-item item-cane" alt="Cane">

    <!-- Taxi di fuga -->
    <img src="Taxi 1.svg" class="collage-item item-taxi" alt="Taxi">

    <!-- Infermiere in agguato -->
    <img src="Infermiere 1.svg" class="collage-item item-infermiere" alt="Infermiere">

    <!-- Ostacoli e Punti sparsi -->
    <img src="Ostacolo.svg" class="collage-item item-ostacolo" alt="Ostacolo">
    <img src="Punto.svg" class="collage-item item-punto1" alt="Punto">
    <img src="Punto.svg" class="collage-item item-punto2" alt="Punto">
</div>

<div id="hero-box">
    <div class="badge-sagra">🎉 FESTA DEL PAESE 🎉</div>
    <h1 class="hero-title">CIAO MARIA, OGGI C'È LA SAGRA!</h1>
    <p class="hero-sub">È il tuo giorno per uccidere la badante!<br>Rompi il vetro per iniziare!</p>
    <div class="prompt-box" id="start-btn">
        <span class="key-cap" id="prompt-device-text">TOCCA QUI O PREMI SPAZIO</span>
    </div>
</div>

<div id="glass-layer" title="Premi Spazio o Tocca lo schermo per rompere il vetro!"></div>
<canvas id="crack-canvas"></canvas>

<div id="axe-container">
    <img id="axe-img" src="Ascia.svg" alt="Ascia">
</div>

<script>
// Rilevamento touch/mobile per testo contestuale
const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
const promptTextEl = document.getElementById('prompt-device-text');
if (isTouchDevice && promptTextEl) {
    promptTextEl.innerHTML = "🔨 TOCCA PER SPACCARE IL VETRO";
}

const diffSelect = document.getElementById('diff-select');
try {
    const savedDiff = sessionStorage.getItem('game_difficulty');
    if (savedDiff) diffSelect.value = savedDiff;
} catch(e) {}

diffSelect.addEventListener('change', () => {
    try {
        sessionStorage.setItem('game_difficulty', diffSelect.value);
    } catch(e) {}
});

const canvas = document.getElementById('crack-canvas');
const ctx = canvas.getContext('2d');
let W = canvas.width = window.innerWidth;
let H = canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
});

// Idle oscillazione accetta
const axeContainer = document.getElementById('axe-container');
let idleTimer = 0;
let hasBroken = false;

function animateIdle() {
    if (!hasBroken) {
        idleTimer += 0.04;
        const offset = Math.sin(idleTimer) * 10;
        axeContainer.style.transform = "translateY(" + offset + "px)";
        requestAnimationFrame(animateIdle);
    }
}
requestAnimationFrame(animateIdle);

// Creazione crepe nel vetro su canvas
function generateGlassShatter(centerX, centerY) {
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
    ctx.lineWidth = Math.max(1.8, Math.min(3, W * 0.0035));
    ctx.shadowColor = 'rgba(180, 230, 255, 0.85)';
    ctx.shadowBlur = 8;

    const numRays = 18;
    const maxRadius = Math.max(W, H) * 0.85;

    for (let i = 0; i < numRays; i++) {
        const baseAngle = (i / numRays) * (Math.PI * 2) + (Math.random() - 0.5) * 0.2;
        let currX = centerX;
        let currY = centerY;
        let dist = 0;

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);

        while (dist < maxRadius) {
            const step = 20 + Math.random() * 40;
            dist += step;
            const angleJitter = baseAngle + (Math.random() - 0.5) * 0.35;
            currX += Math.cos(angleJitter) * step;
            currY += Math.sin(angleJitter) * step;
            ctx.lineTo(currX, currY);

            if (Math.random() < 0.4) {
                const subAngle = angleJitter + (Math.random() > 0.5 ? 0.6 : -0.6);
                const subLen = 15 + Math.random() * 35;
                ctx.moveTo(currX, currY);
                ctx.lineTo(currX + Math.cos(subAngle) * subLen, currY + Math.sin(subAngle) * subLen);
                ctx.moveTo(currX, currY);
            }
        }
        ctx.stroke();
    }

    // Cerchi concentrici
    const ringCount = 6;
    for (let r = 1; r <= ringCount; r++) {
        const radius = r * (30 + Math.random() * 25);
        ctx.beginPath();
        const steps = 18;
        for (let s = 0; s <= steps; s++) {
            const a = (s / steps) * (Math.PI * 2);
            const radVar = radius + (Math.random() - 0.5) * 18;
            const px = centerX + Math.cos(a) * radVar;
            const py = centerY + Math.sin(a) * radVar;
            if (s === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.stroke();
    }

    // Epicentro frantumato
    ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
    ctx.beginPath();
    ctx.arc(centerX, centerY, 42, 0, Math.PI * 2);
    ctx.fill();
}

// Suono sintetico frantumazione vetro (Web Audio API)
function playGlassShatterSound() {
    try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const actx = new AudioContext();

        const bufferSize = actx.sampleRate * 0.35;
        const buffer = actx.createBuffer(1, bufferSize, actx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (actx.sampleRate * 0.08));
        }

        const noise = actx.createBufferSource();
        noise.buffer = buffer;

        const filter = actx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 2200;

        const osc = actx.createOscillator();
        const gain = actx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(450, actx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, actx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.7, actx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + 0.25);

        noise.connect(filter);
        filter.connect(actx.destination);
        osc.connect(gain);
        gain.connect(actx.destination);

        noise.start();
        osc.start();
        osc.stop(actx.currentTime + 0.3);
    } catch(e) {}
}

function breakGlass() {
    if (hasBroken) return;
    hasBroken = true;

    try {
        sessionStorage.setItem('game_difficulty', diffSelect.value);
        sessionStorage.removeItem('enemy_hp');
    } catch(e) {}

    // Esegui fendente dell'accetta
    axeContainer.classList.add('swing-axe');
    
    // Al contatto (circa 220ms): crepa vetro, suono e bagliore
    setTimeout(() => {
        const hitX = W * 0.50;
        const hitY = H * 0.48;
        generateGlassShatter(hitX, hitY);
        playGlassShatterSound();

        const glassLayer = document.getElementById('glass-layer');
        glassLayer.classList.add('broken-flash');

        // Dissolvenza e caricamento del livello prato
        setTimeout(() => {
            document.body.style.transition = 'opacity 0.4s ease-out, filter 0.4s ease-out';
            document.body.style.opacity = '0';
            document.body.style.filter = 'brightness(1.8)';
            setTimeout(() => {
                window.location.href = 'Sfondo 3.html';
            }, 400);
        }, 550);
    }, 220);
}

// Supporto Tastiera
window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.key === ' ' || e.keyCode === 32) {
        e.preventDefault();
        breakGlass();
    }
});

// Supporto Touch e Click immediato (senza delay 300ms)
const glassLayer = document.getElementById('glass-layer');
const startBtn = document.getElementById('start-btn');

glassLayer.addEventListener('touchstart', (e) => {
    e.preventDefault();
    breakGlass();
}, { passive: false });

glassLayer.addEventListener('click', breakGlass);

if (startBtn) {
    startBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        breakGlass();
    }, { passive: false });
    startBtn.addEventListener('click', breakGlass);
}
</script>

</body>
</html>
